[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rag-project"
version = "0.1.0"
description = "Production-grade local RAG pipeline — ingestion, embedding, retrieval, generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core RAG
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
    # Document loaders
    "pymupdf>=1.24.0",          # PDF
    "python-docx>=1.1.0",       # DOCX
    "beautifulsoup4>=4.12.0",   # HTML
    "lxml>=5.0.0",              # HTML parser
    "pandas>=2.0.0",            # CSV / tabular
    "openpyxl>=3.1.0",          # xlsx support via pandas
    # Tokenisation
    "tiktoken>=0.7.0",
    # LLM — Ollama
    "ollama>=0.3.0",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    # UI
    "streamlit>=1.35.0",
    # Utilities
    "rich>=13.0.0",
    "click>=8.1.0",
    "python-magic>=0.4.27",
    "chardet>=5.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
rag-ingest = "cli.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
